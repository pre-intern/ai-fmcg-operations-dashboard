<style>
  :root {
    --primary: #2c3e50;
    --accent: #3498db;
    --warning: #e74c3c;
    --success: #2ecc71;
    --bg: #f5f6fa;
    --card-bg: #ffffff;
    --text: #2c3e50;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
  }

  .dashboard {
    max-width: 1400px;
    margin: 0 auto;
  }

  header {
    background: var(--primary);
    color: white;
    padding: 20px 30px;
    border-radius: 12px;
    margin-bottom: 20px;
  }
  header h1 { font-size: 24px; margin-bottom: 5px; }

  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 20px;
    background: white;
    border-radius: 12px;
    padding: 5px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
  }
  .tab {
    background: none;
    border: none;
    padding: 12px 20px;
    cursor: pointer;
    border-radius: 8px;
    font-weight: 600;
    color: #7f8c8d;
    transition: all 0.3s;
  }
  .tab.active { background: var(--accent); color: white; }
  .tab:hover { background: #ecf0f1; }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .kpi-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    margin-bottom: 20px;
  }
  .kpi-card {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .kpi-value { font-size: 28px; font-weight: bold; color: var(--accent); }
  .kpi-label { font-size: 14px; color: #7f8c8d; margin-top: 5px; }
  .warning .kpi-value { color: var(--warning); }

  .chart-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
    gap: 20px;
    margin-bottom: 20px;
  }
  .chart-container {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    min-height: 400px;
  }

  .table-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
    gap: 20px;
  }
  .table-container {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    padding: 8px 12px;
    text-align: left;
    border-bottom: 1px solid #ecf0f1;
  }
  th { background: #f8f9fa; font-weight: 600; }

  @media (max-width: 800px) {
    .chart-row, .table-row { grid-template-columns: 1fr; }
  }
</style>
